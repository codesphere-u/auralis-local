name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t auralis-local:ci .
      - name: Verify non-root container & tsx runtime
        run: |
          docker run --rm auralis-local:ci node -e "if (process.getuid && process.getuid() === 0) process.exit(1)"
          docker run --rm auralis-local:ci ./node_modules/.bin/tsx --version
