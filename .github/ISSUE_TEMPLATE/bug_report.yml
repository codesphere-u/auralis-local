name: 🐛 Bug Report
description: Create a report to help us improve and fix reproducible bugs.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please ensure you test against the latest commit on `main`.
  - type: input
    id: version
    attributes:
      label: Version / Commit SHA
      description: What version or git commit are you running?
      placeholder: "e.g., v1.1.0 or git rev-parse HEAD"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal reproducible example or commands executed.
      placeholder: |
        1. Run '...'
        2. Call endpoint '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Tracebacks
      render: shell
